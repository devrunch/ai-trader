<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="960" height="740" fill="#ffffff"/>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0f172a">How a Pine Script indicator runs</text>
  <text x="28" y="62" font-size="13" fill="#64748b">Indicator code is never run in the browser or inside the API. It runs in a locked-down worker on the server, on the bars the chart already has.</text>

  <!-- where source comes from -->
  <text x="28" y="96" font-size="13" font-weight="700" fill="#0f172a">Where the Pine source comes from</text>
  <rect x="28" y="106" width="290" height="58" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="44" y="128" font-size="12" font-weight="600" fill="#14532d">Indicator picker</text>
  <text x="44" y="146" font-size="11" fill="#15803d">51 stored in MongoDB (built-in + saved)</text>
  <rect x="335" y="106" width="290" height="58" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="351" y="128" font-size="12" font-weight="600" fill="#14532d">Indicator editor</text>
  <text x="351" y="146" font-size="11" fill="#15803d">your own Pine, run as you edit</text>
  <rect x="642" y="106" width="290" height="58" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="658" y="128" font-size="12" font-weight="600" fill="#14532d">Chat agent</text>
  <text x="658" y="146" font-size="11" fill="#15803d">the LLM writes Pine on request</text>

  <!-- lifelines -->
  <g font-size="12" font-weight="700" fill="#334155">
    <text x="60" y="202">Browser</text><text x="260" y="202">API</text><text x="420" y="202">signals (Python)</text><text x="630" y="202">Node sandbox</text><text x="810" y="202">Worker thread</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="86" y1="212" x2="86" y2="600"/><line x1="276" y1="212" x2="276" y2="600"/><line x1="476" y1="212" x2="476" y2="600"/><line x1="676" y1="212" x2="676" y2="600"/><line x1="846" y1="212" x2="846" y2="600"/>
  </g>

  <!-- steps -->
  <g font-size="11">
    <line x1="86" y1="240" x2="270" y2="240" stroke="#475569" marker-end="url(#p)"/>
    <text x="96" y="232" fill="#0f172a">1 · POST /api/pine/run</text>
    <text x="96" y="256" fill="#64748b">source + loaded bars + symbol</text>

    <line x1="276" y1="286" x2="470" y2="286" stroke="#475569" marker-end="url(#p)"/>
    <text x="286" y="278" fill="#0f172a">2 · forward, login checked</text>
    <text x="286" y="302" fill="#64748b">10 s timeout · body up to 15 MB</text>

    <line x1="476" y1="332" x2="670" y2="332" stroke="#475569" marker-end="url(#p)"/>
    <text x="486" y="324" fill="#0f172a">3 · one JSON line on stdin</text>
    <text x="486" y="348" fill="#64748b">one request at a time (semaphore)</text>

    <line x1="676" y1="378" x2="840" y2="378" stroke="#475569" marker-end="url(#p)"/>
    <text x="686" y="370" fill="#0f172a">4 · fresh worker thread</text>
    <text x="686" y="394" fill="#64748b">256 MB heap cap · 5 s limit</text>

    <rect x="760" y="410" width="172" height="72" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="772" y="430" font-weight="600" fill="#78350f">5 · PineTS executes</text>
    <text x="772" y="447" fill="#b45309">on the bars it was given,</text>
    <text x="772" y="462" fill="#b45309">no data fetched · plots and</text>
    <text x="772" y="476" fill="#b45309">strategy results collected</text>

    <line x1="840" y1="510" x2="682" y2="510" stroke="#16a34a" marker-end="url(#p)"/>
    <text x="690" y="502" fill="#15803d">6 · plots, or an error</text>

    <line x1="670" y1="540" x2="482" y2="540" stroke="#16a34a" marker-end="url(#p)"/>
    <text x="490" y="532" fill="#15803d">7 · one JSON line on stdout</text>

    <line x1="470" y1="566" x2="282" y2="566" stroke="#16a34a" marker-end="url(#p)"/>
    <line x1="270" y1="590" x2="92" y2="590" stroke="#16a34a" marker-end="url(#p)"/>
    <text x="100" y="582" fill="#15803d">8 · plots → chart series / panes</text>
  </g>

  <!-- safety -->
  <text x="28" y="636" font-size="13" font-weight="700" fill="#0f172a">Why it's built this way</text>
  <rect x="28" y="648" width="290" height="78" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="44" y="670" font-size="12" font-weight="600" fill="#7f1d1d">Untrusted code stays boxed</text>
  <text x="44" y="688" font-size="11" fill="#b91c1c">Pine from users and the AI never runs</text>
  <text x="44" y="704" font-size="11" fill="#b91c1c">in the API or Python process. A runaway</text>
  <text x="44" y="719" font-size="11" fill="#b91c1c">script is killed at 5 s or 256 MB.</text>
  <rect x="335" y="648" width="290" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="351" y="670" font-size="12" font-weight="600" fill="#1e3a8a">One Node process, reused</text>
  <text x="351" y="688" font-size="11" fill="#1d4ed8">Starting Node for every indicator was too</text>
  <text x="351" y="704" font-size="11" fill="#1d4ed8">slow and memory-hungry on this box. Each</text>
  <text x="351" y="719" font-size="11" fill="#1d4ed8">run still gets its own thread.</text>
  <rect x="642" y="648" width="290" height="78" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="658" y="670" font-size="12" font-weight="600" fill="#14532d">Same bars as the chart</text>
  <text x="658" y="688" font-size="11" fill="#15803d">The indicator is computed on exactly the</text>
  <text x="658" y="704" font-size="11" fill="#15803d">candles on screen, so lines always line</text>
  <text x="658" y="719" font-size="11" fill="#15803d">up with price — no second data fetch.</text>
</svg>
