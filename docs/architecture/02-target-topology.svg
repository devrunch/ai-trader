<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="940" height="700" fill="#ffffff"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0f172a">Target — same box, same free tier, two failure domains</text>
  <text x="28" y="62" font-size="13" fill="#64748b">A modular monolith split by import boundary and blast radius, not by domain nouns. No Docker, no Celery, no SQS, no Kubernetes.</text>

  <rect x="28" y="84" width="566" height="520" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="110" font-size="13" font-weight="700" fill="#334155">EC2 t4g.small — systemd units, one venv, no container runtime</text>

  <rect x="46" y="124" width="530" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="62" y="150" font-size="12" font-weight="600" fill="#0c4a6e">caddy.service — TLS, reverse proxy · 22 MB</text>

  <rect x="46" y="178" width="258" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="62" y="200" font-size="12" font-weight="600" fill="#064e3b">frontend.service · 42 MB</text>
  <text x="62" y="218" font-size="11" fill="#047857">Next.js standalone output</text>
  <text x="62" y="236" font-size="11" fill="#047857">built off-box, rsynced in</text>

  <rect x="318" y="178" width="258" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="334" y="200" font-size="12" font-weight="600" fill="#064e3b">api.service · 121 MB</text>
  <text x="334" y="218" font-size="11" fill="#047857">NestJS · Mongo · Socket.IO</text>
  <text x="334" y="236" font-size="11" fill="#047857">internal endpoints (shared key)</text>

  <rect x="46" y="262" width="258" height="170" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="62" y="284" font-size="12" font-weight="700" fill="#78350f">signals.service · 235 MB</text>
  <text x="62" y="302" font-size="11" fill="#b45309">FastAPI + the two websockets</text>
  <text x="62" y="320" font-size="11" fill="#b45309">Kite ticks · Deriv 1 Hz</text>
  <text x="62" y="338" font-size="11" fill="#b45309">chat agent (SSE) · Pine sandbox</text>
  <text x="62" y="356" font-size="11" fill="#b45309">APScheduler: the cheap cron jobs</text>
  <text x="62" y="374" font-size="11" fill="#b45309">imports pandas — that is fine here</text>
  <rect x="62" y="386" width="226" height="36" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="3 2"/>
  <text x="72" y="402" font-size="10" fill="#92400e">MemoryMin=300M · OOMScoreAdjust=−500</text>
  <text x="72" y="416" font-size="10" fill="#92400e">protected from reclaim and from the OOM killer</text>

  <rect x="318" y="262" width="258" height="170" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="334" y="284" font-size="12" font-weight="700" fill="#14532d">newsd.service · ~90 MB</text>
  <text x="334" y="302" font-size="11" fill="#15803d">RSS firehose (conditional GET)</text>
  <text x="334" y="320" font-size="11" fill="#15803d">primary-source watchers</text>
  <text x="334" y="338" font-size="11" fill="#15803d">DateTrigger wake-ups (T−30s)</text>
  <text x="334" y="356" font-size="11" fill="#15803d">sentiment + LLM impact + Telegram</text>
  <text x="334" y="374" font-size="11" font-weight="600" fill="#166534">never imports pandas — enforced</text>
  <rect x="334" y="386" width="226" height="36" rx="4" fill="#f7fee7" stroke="#65a30d" stroke-dasharray="3 2"/>
  <text x="344" y="402" font-size="10" fill="#3f6212">MemoryMax=350M · MemorySwapMax=0</text>
  <text x="344" y="416" font-size="10" fill="#3f6212">OOMScoreAdjust=+500 · dies alone, first</text>

  <rect x="46" y="446" width="258" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="62" y="468" font-size="12" font-weight="600" fill="#1e3a8a">redis.service · 8 MB</text>
  <text x="62" y="486" font-size="11" fill="#1d4ed8">caches, dedupe sets, tick pub/sub</text>

  <rect x="318" y="446" width="258" height="52" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="334" y="468" font-size="12" font-weight="600" fill="#334155">no queue broker</text>
  <text x="334" y="486" font-size="11" fill="#475569">in-process scheduler; Dramatiq later if needed</text>

  <rect x="46" y="512" width="530" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="62" y="534" font-size="12" font-weight="700" fill="#7f1d1d">Deleted outright</text>
  <text x="62" y="553" font-size="11" fill="#b91c1c">dockerd + containerd (−206 MB) · celery worker + beat (−283 MB)</text>
  <text x="62" y="571" font-size="11" fill="#b91c1c">SQS broker + the 24/7 poller on a dead queue · yfinance in the news path (−65 MB)</text>

  <rect x="618" y="84" width="294" height="520" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="636" y="110" font-size="13" font-weight="700" fill="#581c87">Free, off the box</text>

  <rect x="636" y="124" width="258" height="80" rx="6" fill="#ffffff" stroke="#c084fc"/>
  <text x="652" y="145" font-size="12" font-weight="600" fill="#6b21a8">GitHub Actions + watchers</text>
  <text x="652" y="163" font-size="11" fill="#7e22ce">Actions: builds the frontend off-box</text>
  <text x="652" y="181" font-size="11" fill="#7e22ce">Healthchecks.io: stale-job pings</text>
  <text x="652" y="197" font-size="11" fill="#7e22ce">UptimeRobot: is the box answering</text>

  <rect x="636" y="216" width="258" height="64" rx="6" fill="#ffffff" stroke="#c084fc"/>
  <text x="652" y="237" font-size="12" font-weight="600" fill="#6b21a8">Telegram Bot API — free</text>
  <text x="652" y="255" font-size="11" fill="#7e22ce">alerts reach the phone even when</text>
  <text x="652" y="271" font-size="11" fill="#7e22ce">the app is closed</text>

  <rect x="636" y="292" width="258" height="80" rx="6" fill="#ffffff" stroke="#c084fc"/>
  <text x="652" y="313" font-size="12" font-weight="600" fill="#6b21a8">Primary sources — free, exact</text>
  <text x="652" y="331" font-size="11" fill="#7e22ce">BLS · BEA · EIA · Fed · RBI</text>
  <text x="652" y="349" font-size="11" fill="#7e22ce">SEC EDGAR · NSE/BSE filings</text>
  <text x="652" y="365" font-size="11" fill="#7e22ce">published calendars + exact times</text>

  <rect x="636" y="384" width="258" height="64" rx="6" fill="#ffffff" stroke="#c084fc"/>
  <text x="652" y="405" font-size="12" font-weight="600" fill="#6b21a8">MongoDB Atlas M0 — free</text>
  <text x="652" y="423" font-size="11" fill="#7e22ce">~2 MB used of the 512 MB cap</text>
  <text x="652" y="439" font-size="11" fill="#7e22ce">TTL on news items keeps it there</text>

  <rect x="636" y="460" width="258" height="64" rx="6" fill="#ffffff" stroke="#c084fc"/>
  <text x="652" y="481" font-size="12" font-weight="600" fill="#6b21a8">Vendors (metered, not free)</text>
  <text x="652" y="499" font-size="11" fill="#7e22ce">LLM calls · HuggingFace FinBERT</text>
  <text x="652" y="515" font-size="11" fill="#7e22ce">Kite · Deriv · yfinance quotes</text>

  <rect x="636" y="536" width="258" height="52" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="652" y="557" font-size="12" font-weight="600" fill="#7c2d12">Not used: Lambda, k8s, ECS</text>
  <text x="652" y="575" font-size="11" fill="#c2410c">see the report for why each loses</text>

  <text x="28" y="632" font-size="12" fill="#475569">Two failure domains: the terminal (signals) and the news engine (newsd). newsd is the one allowed to die — it is capped, denied swap, and</text>
  <text x="28" y="652" font-size="12" fill="#475569">scored as the OOM killer's first choice, while signals is reserve-protected. Everything else is one restartable unit.</text>
  <text x="28" y="676" font-size="12" fill="#475569">App and runtime: ~518 MB, down from 917 MB. About 1.0 GB available, versus 601 MB today.</text>
</svg>
