<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="940" height="660" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0f172a">News engine — what happens to one story</text>
  <text x="28" y="62" font-size="13" fill="#64748b">Two entry paths: the scheduled sweep, and the event watcher that knows a release is due at a fixed second.</text>

  <rect x="28" y="86" width="884" height="126" rx="10" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="46" y="110" font-size="13" font-weight="700" fill="#0c4a6e">A · Sweep — every minute (fast feeds) to 15 minutes (the long tail)</text>
  <rect x="46" y="122" width="180" height="74" rx="6" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="60" y="143" font-size="12" font-weight="600" fill="#0c4a6e">~50 RSS/Atom feeds</text>
  <text x="60" y="161" font-size="11" fill="#0369a1">Yahoo, CNBC, FXStreet,</text>
  <text x="60" y="177" font-size="11" fill="#0369a1">Kitco, CoinDesk, ET…</text>
  <rect x="262" y="122" width="200" height="74" rx="6" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="276" y="143" font-size="12" font-weight="600" fill="#0c4a6e">Conditional GET</text>
  <text x="276" y="161" font-size="11" fill="#0369a1">ETag / If-Modified-Since</text>
  <text x="276" y="177" font-size="11" fill="#0369a1">most replies: 304, no parse</text>
  <rect x="498" y="122" width="200" height="74" rx="6" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="512" y="143" font-size="12" font-weight="600" fill="#0c4a6e">Dedupe</text>
  <text x="512" y="161" font-size="11" fill="#0369a1">URL hash + title simhash</text>
  <text x="512" y="177" font-size="11" fill="#0369a1">Redis set, 48 h TTL</text>
  <rect x="734" y="122" width="160" height="74" rx="6" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="748" y="143" font-size="12" font-weight="600" fill="#0c4a6e">Cluster</text>
  <text x="748" y="161" font-size="11" fill="#0369a1">one story, many</text>
  <text x="748" y="177" font-size="11" fill="#0369a1">outlets → one item</text>
  <line x1="226" y1="159" x2="256" y2="159" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="462" y1="159" x2="492" y2="159" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="698" y1="159" x2="728" y2="159" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="28" y="226" width="884" height="150" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="46" y="250" font-size="13" font-weight="700" fill="#713f12">B · Event watcher — the PPI case, where the number beats the news</text>
  <rect x="46" y="262" width="196" height="96" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="60" y="283" font-size="12" font-weight="600" fill="#713f12">Discover (daily)</text>
  <text x="60" y="301" font-size="11" fill="#a16207">BLS, BEA, EIA, Fed, RBI,</text>
  <text x="60" y="317" font-size="11" fill="#a16207">SEC, NSE/BSE calendars</text>
  <text x="60" y="337" font-size="11" fill="#a16207">every event needs a dated</text>
  <text x="60" y="353" font-size="11" fill="#a16207">source — no guessing</text>
  <rect x="278" y="262" width="196" height="96" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="292" y="283" font-size="12" font-weight="600" fill="#713f12">Plan (once)</text>
  <text x="292" y="301" font-size="11" fill="#a16207">what it could move,</text>
  <text x="292" y="317" font-size="11" fill="#a16207">in which direction,</text>
  <text x="292" y="337" font-size="11" fill="#a16207">what the market expects</text>
  <text x="292" y="353" font-size="11" fill="#a16207">→ heads-up to the user</text>
  <rect x="510" y="262" width="196" height="96" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="524" y="283" font-size="12" font-weight="600" fill="#713f12">Wake and watch</text>
  <text x="524" y="301" font-size="11" fill="#a16207">30 s before release,</text>
  <text x="524" y="317" font-size="11" fill="#a16207">poll the agency URL</text>
  <text x="524" y="337" font-size="11" fill="#a16207">every 2 s, up to 5 min,</text>
  <text x="524" y="353" font-size="11" fill="#a16207">until the number lands</text>
  <rect x="742" y="262" width="152" height="96" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="756" y="283" font-size="12" font-weight="600" fill="#713f12">Compare</text>
  <text x="756" y="301" font-size="11" fill="#a16207">actual vs expected</text>
  <text x="756" y="317" font-size="11" fill="#a16207">(or vs previous when</text>
  <text x="756" y="337" font-size="11" fill="#a16207">no forecast is free)</text>
  <line x1="242" y1="310" x2="272" y2="310" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="474" y1="310" x2="504" y2="310" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="706" y1="310" x2="736" y2="310" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="28" y="390" width="884" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="46" y="414" font-size="13" font-weight="700" fill="#4c1d95">Shared tail — both paths end here, already built today</text>
  <rect x="46" y="426" width="196" height="112" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="60" y="447" font-size="12" font-weight="600" fill="#4c1d95">Score</text>
  <text x="60" y="465" font-size="11" fill="#6d28d9">FinBERT sentiment via</text>
  <text x="60" y="481" font-size="11" fill="#6d28d9">remote API — no model</text>
  <text x="60" y="497" font-size="11" fill="#6d28d9">loaded on the box</text>
  <text x="60" y="519" font-size="11" fill="#6d28d9">unscored stays "unscored"</text>
  <rect x="278" y="426" width="196" height="112" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="292" y="447" font-size="12" font-weight="600" fill="#4c1d95">Impact analysis</text>
  <text x="292" y="465" font-size="11" fill="#6d28d9">LLM, batched per cluster</text>
  <text x="292" y="481" font-size="11" fill="#6d28d9">which symbols, direction,</text>
  <text x="292" y="497" font-size="11" fill="#6d28d9">reason from the text</text>
  <text x="292" y="519" font-size="11" fill="#6d28d9">48 h per-URL cache</text>
  <rect x="510" y="426" width="196" height="112" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="524" y="447" font-size="12" font-weight="600" fill="#4c1d95">Persist</text>
  <text x="524" y="465" font-size="11" fill="#6d28d9">POST to the NestJS</text>
  <text x="524" y="481" font-size="11" fill="#6d28d9">internal endpoint</text>
  <text x="524" y="497" font-size="11" fill="#6d28d9">(shared-key guard)</text>
  <text x="524" y="519" font-size="11" fill="#6d28d9">→ MongoDB Atlas</text>
  <rect x="742" y="426" width="152" height="112" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="756" y="447" font-size="12" font-weight="600" fill="#4c1d95">Deliver</text>
  <text x="756" y="465" font-size="11" fill="#6d28d9">Socket.IO → open app</text>
  <text x="756" y="481" font-size="11" fill="#6d28d9">Telegram → phone</text>
  <text x="756" y="503" font-size="11" fill="#6d28d9">alerts feed + bell</text>
  <line x1="242" y1="482" x2="272" y2="482" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="474" y1="482" x2="504" y2="482" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="706" y1="482" x2="736" y2="482" stroke="#64748b" marker-end="url(#a)"/>
  <path d="M 912 149 L 926 149 L 926 475 L 916 475" fill="none" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="470" y1="376" x2="470" y2="386" stroke="#64748b" marker-end="url(#a)"/>

  <text x="28" y="596" font-size="12" fill="#475569">Cost control: 304s make polling nearly free; clustering means five outlets on one story cost one LLM call, not five.</text>
  <text x="28" y="616" font-size="12" fill="#475569">Honesty rule kept from the existing pipeline: null means "could not check", empty means "checked, found nothing".</text>
  <text x="28" y="640" font-size="12" fill="#475569">Every planned event traces back to a real dated source; nothing is invented.</text>
</svg>
