# Production overlay — applied on top of docker-compose.yml, never in place
# of it. The base file stays what local dev runs unmodified; this file only
# adds what a real deployment needs and could never make sense on a laptop:
# TLS termination, and a public origin baked into the two apps that need one.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# ${PUBLIC_HOSTNAME} is written by deploy.sh right before this runs — see that
# script for why it cannot be hardcoded here.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

  # Built and published by the frontend repo's CI (ARM, for this box), never
  # built here: `next build` needs most of this box's 2 GB, which is what made
  # every deploy a full outage. NEXT_PUBLIC_API_URL is inlined at build time,
  # so CI bakes in the public origin; a hostname change needs a rebuild there.
  frontend:
    image: ghcr.io/devrunch/ai-trader-frontend:latest
    pull_policy: always
    environment:
      NEXT_PUBLIC_API_URL: https://${PUBLIC_HOSTNAME}

  api:
    environment:
      FRONTEND_URL: https://${PUBLIC_HOSTNAME}

# The base file already binds api/frontend/redis to 127.0.0.1 only — that is
# already correct for prod (unreachable from outside the host) and Caddy still
# reaches them by service name over the compose network regardless, so nothing
# about those port bindings needs to change here.

volumes:
  caddy_data:
  caddy_config:
