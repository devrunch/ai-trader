services:

  # ── Redis: live-tick pub/sub between signals and api ────────────────
  redis:
    image: redis:7-alpine
    # Published because signals and newsd live outside this network now.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # `signals` and `newsd` are not here: they run under systemd (see
  # systemd/*.service), where the news engine can be memory-capped without
  # the terminal being capped with it. Both reach Redis and the API through
  # the published 127.0.0.1 ports below.

  # ── NestJS API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./ai-trader-api
      dockerfile: ../docker/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ./ai-trader-api/.env
    # host-gateway: signals runs on the host now, not in this network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SIGNALS_SERVICE_URL: http://host.docker.internal:8001
      FRONTEND_URL: http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Next.js frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./ai-trader-frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
